MODEL:
  PRETRAIN_PATH: "/ssd_data/lixiang_data/SDF-Net/model/vit_base_p16_224.pth"
  NAME: 'transformer'
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransOSS'
  STRIDE_SIZE: [16, 16]
  MIE: True
  MIE_COE: 3.0
  SSE: True
  DISENTANGLE: True
  ABLATION_MODE: "sum"
  STRUCT_LAYER_INDEX: 6
  DROP_PATH: 0.1
  DROP_OUT: 0.0
  ATT_DROP_RATE: 0.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.0
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATASETS:
  NAMES: ('Pretrain')
  ROOT_DIR: ('/ssd_data/lixiang_data/Datasets/Opt-SAR-ReID/Cleaned_SDFNet_Data/Pretrain')

DATALOADER:
  NUM_WORKERS: 8

SOLVER:
  SEED: 1949
  MAX_EPOCHS: 100
  BASE_LR: 0.0003
  IMS_PER_BATCH: 64
  CHECKPOINT_PERIOD: 10
  WEIGHT_DECAY: 0.05

OUTPUT_DIR: "./logs/Pretrain_TransOSS_Contrastive/"

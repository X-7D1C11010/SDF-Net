MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: "/ssd_data/lixiang_data/SDF-Net/logs/Pretrain_TransOSS_Contrastive/transoss_contrastive_best.pth"
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  ID_LOSS_WEIGHT: 0.05
  TRIPLET_LOSS_WEIGHT: 1.0
  CM_CONTRAST_LOSS_WEIGHT: 1.0
  CM_PROTO_LOSS_WEIGHT: 0.5
  CM_CONTRAST_TEMP: 0.07
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransOSS'
  STRIDE_SIZE: [16, 16]
  MIE: True
  MIE_COE: 3.0
  SSE: True
  PAIR: False
  DISENTANGLE: True
  ABLATION_MODE: "sum"
  ORTH_LOSS_WEIGHT: 5.0
  STRUCT_LOSS_WEIGHT: 1.0
  STRUCT_LAYER_INDEX: 6

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.2
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATASETS:
  NAMES: ('Merged')
  ROOT_DIR: ('/ssd_data2/lixiang_data/Datasets/Opt-SAR-ReID/Cleaned_SDFNet_Data_Rebuild/HOSS-MOSShip-Merged-O2S')
  TRAIN_PAIR_ONLY: True
  PAIR_STRATEGY: 'zip'
  MAX_PAIR_PER_ID: 64

DATALOADER:
  SAMPLER: 'softmax_triplet'
  CROSS_MODAL_SAMPLER: True
  NUM_INSTANCE: 2
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0003
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 50
  EVAL_PERIOD: 5
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 32
  RE_RANKING: False
  WEIGHT: "./logs/SDF-Net_HOSS_MOSShip_Rebuild/best.pth"
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: "./logs/SDF-Net_HOSS_MOSShip_Rebuild/"
